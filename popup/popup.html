<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <h1>Job Autofill</h1>
  </header>

  <div id="pick-wrap" hidden>
    <label class="pick" for="profile-select">Fill as</label>
    <select id="profile-select"></select>
  </div>

  <div id="profile-warning" class="warn" hidden>
    This profile is empty. <a href="#" id="setup-link">Set it up first.</a>
  </div>

  <button id="fill" class="primary">Fill this application</button>
  <p class="hint">Shortcut: <kbd id="shortcut">Alt+Shift+F</kbd>. Press it again on each page of multi-step forms like Workday.</p>

  <div id="result" hidden></div>

  <label class="row">
    <input type="checkbox" id="overwrite">
    <span>Overwrite fields that already have text</span>
  </label>

  <footer>
    <a href="#" id="options-link">Edit profiles &amp; answers</a>
  </footer>
  <script src="../lib/store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
